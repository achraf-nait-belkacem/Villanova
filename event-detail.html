<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>villa.nova — événement</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Koto:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>

    <h1 class="sr-only">Détails de l'événement</h1>

    <header class="navbar" role="banner">
      <a class="navbar__logo" href="index.html" aria-label="villa.nova — retour à l'accueil">
        <span class="logo-name" aria-hidden="true">villa<span class="logo-dot">.</span>nova</span>
        <span class="logo-tagline" aria-hidden="true">city · culture · for everyone</span>
      </a>
      <nav class="navbar__nav" aria-label="Navigation principale">
        <ul class="nav-list" role="list">
          <li><a class="nav-link" href="index.html">Discover</a></li>
        </ul>
      </nav>
    </header>

    <div class="detail-topbar">
      <a class="detail-topbar__back" href="index.html">← Back to events</a>
    </div>

    <main id="main-content" class="detail" aria-labelledby="event-title">

      <img id="event-image" class="detail__hero" src="" alt="" />

      <div class="detail__body">
        <h2 class="detail__title" id="event-title"></h2>
        <p class="detail__lieu" id="event-lieu"></p>
        <p class="detail__date" id="event-date"></p>
        <p class="detail__description" id="event-description"></p>
      </div>

    </main>

    <script src="js/detail.js"></script>
  </body>
</html>
