<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>villa.nova — city · culture · for everyone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Koto:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>

    <h1 class="sr-only">villa.nova — événements culturels</h1>

    <header class="navbar" role="banner">
      <a class="navbar__logo" href="index.html" aria-label="villa.nova — accueil">
        <span class="logo-name" aria-hidden="true">villa<span class="logo-dot">.</span>nova</span>
        <span class="logo-tagline" aria-hidden="true">city · culture · for everyone</span>
      </a>
      <div class="search-container" role="search" >
        <label for="search-events">Rechercher un evenement</label>
        <input type="search" id="search-events" placeholder="events, exposition, ...." autocomplete="off" aria-autocomplete="list" aria-controls="search-suggestion">
        <ul id="search-suggestion" role="listbox"></ul>
      </div>
      <nav class="navbar__nav" aria-label="Navigation principale">
        <ul class="nav-list" role="list">
          <li><a class="nav-link nav-link--active" href="index.html" aria-current="page">Discover</a></li>
        </ul>
      </nav>
    </header>

    <main class="agenda" id="main-content">

      <section class="agenda__content" aria-labelledby="agenda-heading">
        <h2 class="agenda__title" id="agenda-heading">Événements</h2>
        <ul class="event-list" id="event-list" aria-label="Liste des événements" aria-live="polite">
        </ul>
      </section>

      <aside class="filter-panel" aria-label="Filtres">
        <h2 class="filter-panel__title">FILTER</h2>

        <div class="filter-group filter-group--city">
          <h3 class="filter-group__label">VILLE</h3>
          <div class="filter-group__pills" role="group" aria-label="Filtrer par ville">
          </div>
        </div>
      </aside>

    </main>

    <footer class="site-footer">
      <p class="site-footer__copy">
        © 2025 villa.nova ·
        <a href="#">Achraf nait belkacem</a> ·
        <a href="#">Accessibilité AA</a>
      </p>
    </footer>

    <script src="js/main.js"></script>
  </body>
</html>
