<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>villa.nova — city · culture · for everyone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Koto:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>

    <h1 class="sr-only">villa.nova — événements culturels</h1>

    <header class="navbar" role="banner">
      <a class="navbar__logo" href="index.html" aria-label="villa.nova — accueil">
        <span class="logo-name" aria-hidden="true">villa<span class="logo-dot">.</span>nova</span>
        <span class="logo-tagline" aria-hidden="true">city · culture · for everyone</span>
      </a>
      <nav class="navbar__nav" aria-label="Navigation principale">
        <ul class="nav-list" role="list">
          <li><a class="nav-link nav-link--active" href="index.html" aria-current="page">Discover</a></li>
        </ul>
      </nav>
    </header>

    <div class="ticker" aria-label="Mises à jour en direct" role="marquee">
      <div class="ticker__track">
        <div class="ticker__content">
          <!-- filled by JS -->
        </div>
      </div>
    </div>

    <!-- Mobile only: current day hero — filled by JS -->
    <section class="date-hero" aria-label="Aperçu du jour sélectionné">
      <div class="date-hero__left">
        <span class="date-hero__day"></span>
        <span class="date-hero__number"></span>
        <span class="date-hero__info"></span>
      </div>
      <div class="date-hero__right">
        <span class="date-hero__label"></span>
        <span class="date-hero__count"></span>
        <span class="date-hero__sub"></span>
      </div>
    </section>

    <!-- Week strip — filled by JS -->
    <section class="week-strip" aria-label="Sélecteur de jour">
      <div class="week-strip__days"></div>
    </section>

    <main class="agenda" id="main-content">

      <section class="agenda__content" aria-labelledby="agenda-date-heading">
        <div class="agenda__header">
          <h2 class="agenda__date" id="agenda-date-heading"></h2>
          <span class="agenda__hint" aria-hidden="true"></span>
        </div>

        <!-- Event list — filled by JS -->
        <ul class="event-list" id="event-list" aria-label="Événements du jour" aria-live="polite" aria-atomic="false">
        </ul>
      </section>

      <aside class="filter-panel" aria-label="Filtres">
        <h2 class="filter-panel__title">FILTER</h2>

        <div class="filter-group filter-group--city">
          <h3 class="filter-group__label">VILLE</h3>
          <div class="filter-group__pills" role="group" aria-label="Filtrer par ville">
            <!-- filled by JS -->
          </div>
        </div>

        <div class="filter-group filter-group--when">
          <h3 class="filter-group__label">QUAND</h3>
          <div class="filter-group__pills" role="group" aria-label="Filtrer par date">
            <!-- filled by JS -->
          </div>
        </div>
      </aside>

    </main>

    <footer class="site-footer">
      <p class="site-footer__copy">
        © 2025 villa.nova ·
        <a href="#">Mentions légales</a> ·
        <a href="#">Accessibilité</a>
      </p>
    </footer>

    <nav class="bottom-nav" aria-label="Navigation mobile">
      <a class="bottom-nav__item bottom-nav__item--active" href="index.html" aria-current="page">
        <svg class="bottom-nav__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
        </svg>
        <span class="bottom-nav__label">Discover</span>
      </a>
    </nav>

    <script src="js/main.js"></script>
  </body>
</html>
